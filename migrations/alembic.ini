# Cấu hình chung cho một cơ sở dữ liệu.

[alembic]
# Mẫu dùng để tạo các tệp di chuyển cơ sở dữ liệu
# file_template = %%(rev)s_%%(slug)s

# Đặt thành 'true' để chạy môi trường khi thực hiện
# lệnh 'revision', bất kể có bật autogenerate hay không
# revision_environment = false


# Cấu hình ghi nhật ký
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
