{% extends "base.html" %}

{% block title %}Gửi OTP · CloudBox{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<main class="auth-shell">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">CB</div>
    <h1>Khôi phục mật khẩu</h1>
    <p>Ba bước nhanh chóng và bảo mật</p>
  </div>

  <section class="glass-card">
    <div class="steps">
      <span class="step active">1</span>
      <span class="step-line"></span>
      <span class="step">2</span>
      <span class="step-line"></span>
      <span class="step">3</span>
    </div>

    <h2>Nhận mã OTP</h2>
    <div class="subtitle">
      Mã xác minh sẽ được gửi tới email đăng ký.
    </div>

    <form method="POST">
      <div class="field">
        <label for="email">Email đăng ký</label>
        <div class="input-wrap">
          <input
            id="email"
            name="email"
            type="email"
            placeholder="ban@example.com"
            required
            autofocus
            autocomplete="email"
          >
        </div>
      </div>

      <button class="primary-btn" type="submit">
        Gửi mã OTP
      </button>
    </form>

    <p class="center-link">
      <a href="{{ url_for('auth.login') }}">Quay lại đăng nhập</a>
    </p>
  </section>
</main>
{% endblock %}
