{% extends "base.html" %}

{% block title %}Đăng nhập · CloudBox{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<main class="auth-shell">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">CB</div>
    <h1>CloudBox</h1>
  </div>

  <section class="glass-card">
    <h2>Chào mừng trở lại</h2>
    <div class="subtitle">
      Đăng nhập để tiếp tục quản lý tài liệu.
    </div>

    <form id="login-form" method="POST" data-async-submit="true">
      <p
        id="login-error"
        class="auth-form-error"
        role="alert"
        aria-live="assertive"
        {% if not login_error %}hidden{% endif %}
      >{{ login_error or '' }}</p>

      <div class="field">
        <label for="username">Tên đăng nhập hoặc email</label>
        <div class="input-wrap">
          <input
            id="username"
            name="username"
            type="text"
            placeholder="Nhập tên đăng nhập hoặc email"
            required
            autofocus
            autocomplete="username"
          >
        </div>
      </div>

      <div class="field">
        <label for="password">Mật khẩu</label>
        <div class="input-wrap">
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Nhập mật khẩu"
            required
            autocomplete="current-password"
          >
        </div>
      </div>

      <div class="login-options">
        <label class="remember-login" for="remember-me">
          <input id="remember-me" name="remember_me" type="checkbox">
          <span aria-hidden="true"></span>
          <span>Duy trì đăng nhập</span>
        </label>
        <a href="{{ url_for('auth.forgot_password') }}">Quên mật khẩu?</a>
      </div>

      <button id="login-submit" class="primary-btn" type="submit">
        Đăng nhập
      </button>
    </form>

    <div class="form-links">
      <span>
        Chưa có tài khoản?
        <a href="{{ url_for('auth.register') }}">Đăng ký</a>
      </span>
    </div>
  </section>
</main>

<script>
  (() => {
    "use strict";

    const form = document.getElementById("login-form");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const submitButton = document.getElementById("login-submit");
    const errorBox = document.getElementById("login-error");
    const defaultButtonLabel = submitButton.textContent.trim();

    const clearError = () => {
      errorBox.hidden = true;
      errorBox.textContent = "";
      username.removeAttribute("aria-invalid");
      password.removeAttribute("aria-invalid");
    };

    const clearCredentials = () => {
      form.reset();
      username.value = "";
      password.value = "";
      username.setAttribute("aria-invalid", "true");
      password.setAttribute("aria-invalid", "true");
      username.focus();
    };

    const showError = (message) => {
      errorBox.textContent = message;
      errorBox.hidden = false;
      clearCredentials();
    };

    const setSubmitting = (submitting) => {
      submitButton.disabled = submitting;
      submitButton.textContent = submitting ? "Đang kiểm tra…" : defaultButtonLabel;
      form.toggleAttribute("aria-busy", submitting);
    };

    username.addEventListener("input", clearError);
    password.addEventListener("input", clearError);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      clearError();
      setSubmitting(true);

      try {
        const response = await fetch(form.action || window.location.href, {
          method: "POST",
          body: new FormData(form),
          headers: { "Accept": "application/json" },
          credentials: "same-origin"
        });
        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          showError(payload.error?.message || "Không thể đăng nhập. Vui lòng thử lại.");
          return;
        }

        const redirectUrl = payload.data?.redirect_url;
        if (!redirectUrl) throw new Error("Missing login redirect URL");
        window.location.assign(redirectUrl);
      } catch (error) {
        showError("Không thể kết nối đến máy chủ. Vui lòng thử lại.");
      } finally {
        setSubmitting(false);
      }
    });
  })();
</script>
{% endblock %}
