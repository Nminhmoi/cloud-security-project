{% extends "base.html" %}

{% block title %}Đặt lại mật khẩu · CloudBox{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<main class="auth-shell">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">CB</div>
    <h1>Sắp hoàn tất!</h1>
    <p>Tạo mật khẩu mới cho tài khoản</p>
  </div>

  <section class="glass-card">
    <div class="steps">
      <span class="step done">1</span>
      <span class="step-line done"></span>
      <span class="step done">2</span>
      <span class="step-line done"></span>
      <span class="step active">3</span>
    </div>

    <h2>Đặt mật khẩu mới</h2>
    <div class="subtitle">
      Sử dụng ít nhất 6 ký tự và không chia sẻ mật khẩu.
    </div>

    <form method="POST">
      <div class="field">
        <label for="new_password">Mật khẩu mới</label>
        <div class="input-wrap">
          <input
            id="new_password"
            name="new_password"
            type="password"
            placeholder="Nhập mật khẩu mới"
            minlength="6"
            required
            autofocus
            autocomplete="new-password"
          >
        </div>
      </div>

      <div class="field">
        <label for="confirm_password">Xác nhận mật khẩu</label>
        <div class="input-wrap">
          <input
            id="confirm_password"
            name="confirm_password"
            type="password"
            placeholder="Nhập lại mật khẩu mới"
            minlength="6"
            required
            autocomplete="new-password"
          >
        </div>
      </div>

      <button class="primary-btn" type="submit">
        Hoàn tất khôi phục
      </button>
    </form>
  </section>
</main>
{% endblock %}
